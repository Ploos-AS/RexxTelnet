name: FS-UAE AROS qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aros-runtime-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install FS-UAE runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fs-uae xvfb curl lhasa unzip file p7zip-full

      - name: Host regression tests
        run: make check

      - name: Gate 1 - internal AROS Kickstart smoke
        run: bash ci/fs-uae/run-aros-smoke.sh

      - name: Gate 2 - AROS boot-floppy smoke
        run: bash ci/fs-uae/run-aros-media-smoke.sh

      - name: Gate 3 - native Bebbo RexxTelnet build
        run: bash ci/fs-uae/build-native.sh

      - name: Gate 4 - M5.3a AROS guest TCP runtime
        run: bash ci/fs-uae/run-aros-guest-runtime.sh

      - name: Upload FS-UAE qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-uae-aros-qualification
          path: build/fs-uae/
          if-no-files-found: warn
